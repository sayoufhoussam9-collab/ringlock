<title>Ringlock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen portrait puzzle. Header strip, a felt game board with the turntable in the middle, controls along the bottom. */
:root {
  --felt: #10352f;
  --felt-2: #17463e;
  --felt-3: #0b2824;
  --brass: #d6a94c;
  --ink: #f4eedc;
  --muted: #a8c2b7;
  --danger: #ff8a7a;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--felt-3); color: var(--ink); font-family: var(--font-body);
  overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app {
  position: relative;
  height: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
header { display: flex; align-items: center; gap: 8px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { margin: 0; font: 400 1.5rem/1.05 var(--font-display); color: var(--ink); letter-spacing: 0.01em; }
.brand span { white-space: nowrap; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); font-variant-numeric: tabular-nums; }
.icon-btn {
  height: 40px; min-width: 38px; padding: 0 8px; border-radius: 12px; cursor: pointer;
  border: 1px solid rgba(214,169,76,0.35); background: var(--felt-2); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 700 0.85rem var(--font-body);
}
.icon-btn svg { width: 20px; height: 20px; flex: none; }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn.hint { color: var(--brass); }
.pulse { animation: pulse 0.9s ease-in-out 3; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(214,169,76,0.45); transform: scale(1.04); } }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
#hint { margin: 0; font-size: 0.88rem; line-height: 1.35; color: var(--muted); min-height: 2.7em; text-wrap: pretty; }
#hint b { color: var(--ink); }
#hint.warn { color: var(--danger); }
#hint.warn b { color: var(--danger); }
#stage { position: relative; flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; background: var(--felt); }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; gap: 8px; align-items: stretch; }
.controls .icon-btn { height: 52px; flex: 1; border-radius: 14px; font-size: 0.95rem; }
.controls .turn { flex: 1.4; background: var(--brass); color: #2b1d00; border-color: transparent; }
.controls .turn:disabled { background: var(--felt-2); color: var(--muted); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(6, 22, 19, 0.78); }
.overlay[hidden] { display: none; }
.card {
  width: min(330px, 100%); box-sizing: border-box; background: var(--felt-2); border-radius: 22px;
  border: 1px solid rgba(214,169,76,0.35); padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,0.5); max-height: 100%; overflow: auto;
}
.card h2 { margin: 0; font: 400 1.9rem/1.1 var(--font-display); color: var(--ink); }
.card p { margin: 0; color: var(--muted); line-height: 1.45; }
.stars { font-size: 2rem; letter-spacing: 0.15em; color: var(--brass); }
.stars .off { color: rgba(255,255,255,0.14); }
.btn { font: 800 1rem var(--font-body); border: 0; border-radius: 14px; padding: 13px 16px; cursor: pointer; background: var(--brass); color: #2b1d00; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid rgba(255,255,255,0.2); }
.btn[hidden] { display: none; }
/* Level map: a winding brass track down the felt, one chapter per room */
.map-ov { padding: 0; place-items: stretch; background: var(--felt-3); }
.map-panel { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.map-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid rgba(214,169,76,0.25); }
.map-head h2 { margin: 0; flex: 1; font: 400 1.4rem var(--font-display); color: var(--ink); }
.map-total { font: 800 0.8rem var(--font-body); color: var(--brass); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
.map-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background:
  radial-gradient(circle at 50% 0%, rgba(29,90,79,0.9), rgba(14,47,42,0.95) 70%), var(--felt); }
.map { position: relative; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.chapter { position: absolute; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 14px; background: rgba(11,40,36,0.92); border: 1px solid rgba(214,169,76,0.25); }
.chapter div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.chapter em { font: 800 0.8rem var(--font-body); font-style: normal; color: var(--brass); font-variant-numeric: tabular-nums; white-space: nowrap; }
.map-legend { margin: 0; padding: 6px 14px 8px; font: 600 0.72rem var(--font-body); color: var(--muted); border-bottom: 1px solid rgba(214,169,76,0.15); }
.map-legend b { color: var(--brass); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; padding: 6px 0; color: var(--ink); font-weight: 700; }
.set-row small { display: block; font-weight: 500; color: var(--muted); font-size: 0.78rem; }
.set-row .btn.mini { width: auto; flex: none; margin: 0; padding: 8px 14px; font-size: 0.85rem; }
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 14px; background: rgba(255,255,255,0.15); transition: background 0.2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform 0.2s; }
.switch input:checked + span { background: var(--brass); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--brass); outline-offset: 2px; }
#volRange { width: 120px; accent-color: var(--brass); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,138,122,0.5); }
.chapter b { font: 400 1.1rem var(--font-display); color: var(--ink); }
.chapter span { font: 700 0.68rem var(--font-body); color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.lv {
  position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 2px solid var(--brass); background: #1f1810; color: var(--ink); font: 400 1.3rem var(--font-display);
  display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.35);
}
.lv.done { background: radial-gradient(circle at 35% 30%, #ffe7a8, var(--brass) 55%, #8a6420); color: #2b1d00; }
.lv.current { box-shadow: 0 0 0 5px rgba(214,169,76,0.35), 0 4px 10px rgba(0,0,0,0.35); animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 10px rgba(214,169,76,0.12), 0 4px 10px rgba(0,0,0,0.35); } }
.lv:disabled { cursor: default; border-color: rgba(214,169,76,0.3); color: rgba(244,238,220,0.35); background: #15110c; }
.lv .st { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); padding: 0 5px; border-radius: 8px; background: rgba(11,40,36,0.9); font-size: 0.72rem; letter-spacing: 0.08em; color: var(--brass); white-space: nowrap; font-family: var(--font-body); }
.lv .st .off { color: rgba(255,255,255,0.18); }
.lv .tag { position: absolute; top: -6px; right: -8px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--felt-2);
  border: 1px solid rgba(214,169,76,0.5); color: var(--brass); font: 800 0.62rem/16px var(--font-body); }
/* Tutorial hand: points at the next move and taps */
#hand { position: absolute; left: 0; top: 0; width: 46px; height: 46px; pointer-events: none; z-index: 5;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45)); transition: transform 0.35s cubic-bezier(.3,1.4,.5,1); }
#hand svg { width: 100%; height: 100%; animation: tap 1.1s ease-in-out infinite; transform-origin: 30% 10%; }
@keyframes tap { 0%, 100% { transform: translate(6px, 10px) scale(1); } 45% { transform: translate(0, 0) scale(0.92); } }
#hand.swipe svg { animation: swipe 1.4s ease-in-out infinite; }
@keyframes swipe { 0% { transform: translate(-18px, 6px); opacity: 0; } 20% { opacity: 1; } 80% { transform: translate(22px, 0); opacity: 1; } 100% { transform: translate(22px, 0); opacity: 0; } }
.skip { margin-left: 6px; padding: 2px 8px; border-radius: 8px; border: 1px solid rgba(214,169,76,0.4); background: transparent; color: var(--brass); font: 700 0.75rem var(--font-body); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app">
  <div id="hand" hidden aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M14 4.5a3 3 0 0 1 6 0V17l1.2-.4a3 3 0 0 1 3.6 1.5l.2.4.9-.2a3 3 0 0 1 3.4 1.8l.2.5.7-.1a3 3 0 0 1 3.3 2.9V30a8 8 0 0 1-8 8h-4.8a8 8 0 0 1-6.3-3.1L8.3 27.6a3 3 0 0 1 4.3-4.2L14 24.8z" fill="#f4eedc" stroke="#2b1d00" stroke-width="1.8" stroke-linejoin="round"/></svg></div>

<script>
(() => {
'use strict';

// Every level was generated by scrambling a solved table backwards and then solved by
// breadth-first search, so "par" is the true minimum number of moves.
const LEVELS = /*LEVELS*/[];

const MARBLES = [
  null,
  { c: '#e5484d', glyph: 'dot' },
  { c: '#3e8ef7', glyph: 'ring' },
  { c: '#f5b82e', glyph: 'bar' },
  { c: '#3cc489', glyph: 'cross' },
  { c: '#b07cf0', glyph: 'tri' },
];

const HINTS = {
  1: 'Tap a <b>tube</b> to tip its top marble onto the turntable, or to scoop up the marble sitting at its mouth. Turn the table with the arrows. Sort every colour into its own tube.',
  2: 'A marble can only land on a marble of the <b>same colour</b>, or in an empty tube.',
  3: 'Three colours now. <b>Par</b> is the fewest moves possible. Match it for 3 stars.',
  5: 'This table only turns <b>one way</b>. Think about where each marble will end up before you drop it.',
  7: 'The <b>brass stud</b> is bolted to the table. It fills a cup and can never move off.',
  10: 'An <b>empty spare tube</b>. Use it, but every tube must end up full of one colour or empty.',
  12: 'A <b>fourth colour</b> joins the table. Green marbles carry a cross.',
  19: 'A breather. Try to match par on the first go.',
  28: 'Two tubes sit <b>side by side</b>. One turn carries a marble from one to the other.',
  33: 'A bigger table with <b>nine cups</b>. More room, more ways to go wrong.',
  39: 'The last table. Studs, one-way turning and tall tubes, all at once.',
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
let W = 0, H = 0, G = null;   // geometry
let lvIndex = 0, cfg = null, st = null, history = [], moves = 0, status = 'play';
let disp = 0;                  // visual ring offset in slots, eased back to 0 after a turn
let flyers = [], shakeTube = -1, shakeT = 0, shakeRing = 0, time = 0, sparks = [], dragOff = 0, redT = 0, redTube = -1;
let baseHint = '', flashTimer = 0;
const NAMES = [null, 'red', 'blue', 'yellow', 'green', 'purple'];
let best = store.get('rl-best', {});
let endTimer = 0;
let tut = null, tutKey = '';
let hintsLeft = 3, hintUsed = false, hint = null, hintBusy = false, pathKeys = new Map(), winT = 0;
const keyOf = s => s.ring.join(',') + '|' + s.tubes.map(t => t.join(',')).join('/');

// ---------- Rules
const clone = s => ({ ring: s.ring.slice(), tubes: s.tubes.map(t => t.slice()) });
function isSolved(s) {
  if (s.ring.some(v => v > 0)) return false;
  return s.tubes.every(t => t.length === 0 || (t.length === cfg.cap && t.every(v => v === t[0])));
}
function budget() { return cfg.par * 2; }
function starsFor(m) { const s = m <= cfg.par ? 3 : m <= cfg.par + Math.ceil(cfg.par * 0.25) ? 2 : 1; return hintUsed ? Math.min(2, s) : s; }

function turn(dir, fromDrag = false) {
  if (status !== 'play') return;
  if (dir < 0 && cfg.oneWay) { shakeRing = 0.35; sfx.deny(); buzz(20); flash('This table only turns <b>clockwise</b>.'); return; }
  finishFlyers();
  history.push(clone(st));
  const N = st.ring.length;
  st.ring = st.ring.map((_, i) => st.ring[(i - dir + N) % N]);
  if (!fromDrag) disp -= dir;   // a drag already shows the table where the finger put it
  afterMove();
  sfx.turn(dir); buzz(6);
}

function tapTube(t) {
  if (status !== 'play') return;
  const p = cfg.ports[t], b = st.ring[p], tube = st.tubes[t];
  finishFlyers();
  if (b > 0) {
    if (tube.length < cfg.cap && (tube.length === 0 || tube[tube.length - 1] === b)) {
      history.push(clone(st));
      const from = slotPos(p);
      st.ring[p] = 0; tube.push(b);
      flyers.push({ c: b, from, to: { tube: t, j: tube.length - 1 }, t: 0 });
      afterMove(); sfx.drop(tube.length); buzz(8);
      if (tube.length === cfg.cap && tube.every(v => v === b)) { setTimeout(() => sfx.tubeDone(t), 120); buzz([8, 40, 12]); }
    } else if (tube.length >= cfg.cap) deny(t, `Tube ${t + 1} is full.`);
    else deny(t, `The top of tube ${t + 1} is <b>${NAMES[tube[tube.length - 1]]}</b>. A ${NAMES[b]} marble can only land on ${NAMES[b]}, or in an empty tube.`);
  } else if (b === 0 && tube.length) {
    history.push(clone(st));
    const j = tube.length - 1, from = tubeBallPos(t, j);
    st.ring[p] = tube.pop();
    flyers.push({ c: st.ring[p], from, to: { slot: p }, t: 0 });
    afterMove(); sfx.lift(); buzz(8);
  } else if (b === -1) deny(t, `The brass stud is parked in front of tube ${t + 1}. Turn the table.`);
  else deny(t, `Nothing to move at tube ${t + 1}. Turn the table to bring a marble to its mouth.`);
}

function deny(t, msg) {
  shakeTube = t; shakeT = 0.35; redTube = t; redT = 0.6;
  sfx.deny(); buzz(25); flash(msg);
}
function flash(html) {
  clearTimeout(flashTimer);
  const el = $('hint'); el.innerHTML = html; el.classList.add('warn');
  flashTimer = setTimeout(() => { el.innerHTML = baseHint; el.classList.remove('warn'); }, 2600);
}
function setHint(html) { baseHint = html; clearTimeout(flashTimer); $('hint').classList.remove('warn'); $('hint').innerHTML = html; }

function undo() {
  if (!history.length || status === 'won') return;
  clearTimeout(endTimer);
  st = history.pop(); moves = Math.max(0, moves - 1); flyers = []; disp = 0; clearHint();
  status = 'play'; $('endOv').hidden = true; updateHud(); sfx.undo();
}

// ---------- Tutorial: a hand points at the next move of the best solution
function updateTutorial() {
  const hand = $('hand');
  // while Settings or the level map is open, just hide the hand and leave the tip as it is
  if (!$('setOv').hidden || !$('levelsOv').hidden) { hand.hidden = true; return; }
  const nextIdx = tut && status === 'play' ? pathKeys.get(keyOf(st)) : undefined;
  const offPath = tut && status === 'play' && nextIdx === undefined;
  if (!tut || status !== 'play' || (!offPath && nextIdx === undefined) || (nextIdx !== undefined && moves >= tut.upTo)) {
    hand.hidden = true;

  const s = s0 + G.len - 7 - G.mr - j * G.mr * 2.15;
  const sh = (t === shakeTube && shakeT > 0) ? Math.sin(shakeT * 60) * 3 : 0;
  return { x: G.cx + Math.cos(a) * s - Math.sin(a) * sh, y: G.cy + Math.sin(a) * s + Math.cos(a) * sh };
}

// ---------- Effects
function finishFlyers() { flyers = []; }
function burstAll() {
  st.tubes.forEach((tube, t) => tube.forEach((c, j) => {
    const p = tubeBallPos(t, j);
    for (let k = 0; k < 6; k++) { const a = Math.random() * 6.28, v = 40 + Math.random() * 110; sparks.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.7 + Math.random() * 0.4, c: MARBLES[c].c }); }
  }));
}

// ---------- Drawing
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawMarble(x, y, r, c, alpha = 1) {
  const m = MARBLES[c];
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.arc(x + r * 0.12, y + r * 0.2, r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
  const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.1, x, y, r * 1.05);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.22, m.c); g.addColorStop(1, shade(m.c, -0.45));
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  // glyph so colours can be told apart without colour
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = Math.max(1.4, r * 0.14);
  const k = r * 0.38;
  ctx.beginPath();
  if (m.glyph === 'dot') { ctx.arc(x, y + r * 0.05, k * 0.55, 0, Math.PI * 2); ctx.fill(); }
  else if (m.glyph === 'ring') { ctx.arc(x, y + r * 0.05, k * 0.8, 0, Math.PI * 2); ctx.stroke(); }
  else if (m.glyph === 'bar') { ctx.moveTo(x - k, y + r * 0.05); ctx.lineTo(x + k, y + r * 0.05); ctx.stroke(); }
  else if (m.glyph === 'cross') { ctx.moveTo(x - k * 0.8, y - k * 0.75); ctx.lineTo(x + k * 0.8, y + k * 0.85); ctx.moveTo(x + k * 0.8, y - k * 0.75); ctx.lineTo(x - k * 0.8, y + k * 0.85); ctx.stroke(); }
  else if (m.glyph === 'tri') { ctx.moveTo(x, y - k * 0.8); ctx.lineTo(x + k * 0.9, y + k * 0.75); ctx.lineTo(x - k * 0.9, y + k * 0.75); ctx.closePath(); ctx.stroke(); }
  ctx.restore();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(v * (1 + amt))));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

function previewAction(t) {
  if (!settings.previews) return 'none';
  if (Math.abs(dragOff) > 0.05 || Math.abs(disp) > 0.05) return 'none';
  const b = st.ring[cfg.ports[t]], tube = st.tubes[t];
  if (b > 0) return tube.length < cfg.cap && (!tube.length || tube[tube.length - 1] === b) ? 'in' : 'blocked';
  if (b === 0 && tube.length) return 'out';
  return 'none';
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // felt texture: soft vignette and a faint weave
  const bg = ctx.createRadialGradient(G.cx, G.cy, 10, G.cx, G.cy, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#1d5a4f'); bg.addColorStop(1, '#0e2f2a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.025)'; ctx.lineWidth = 1;
  for (let x = -H; x < W; x += 9) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H, H); ctx.stroke(); }

  const { cx, cy, R, mr } = G;
  const N = cfg.ring.length;
  const cupR = Math.min(R * Math.sin(G.step / 2) * 0.86, mr + 5);
  const shakeX = shakeRing > 0 ? Math.sin(shakeRing * 60) * 3 : 0;

  // tubes
  cfg.ports.forEach((p, t) => {
    const a = portAngle(t);
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(a);
    const s0 = R + cupR + G.gap;
    const sh = (t === shakeTube && shakeT > 0) ? Math.sin(shakeT * 60) * 3 : 0;
    ctx.translate(0, sh);
    // glass body
    rr(s0, -G.tw / 2, G.len, G.tw, G.tw / 2);
    ctx.fillStyle = 'rgba(220,240,232,0.08)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(220,240,232,0.35)'; ctx.stroke();
    if (t === redTube && redT > 0) { ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,120,100,${Math.min(1, redT * 2)})`; ctx.stroke(); }
    // brass collar at the mouth
    rr(s0 - 3, -G.tw / 2 - 3, 7, G.tw + 6, 3); ctx.fillStyle = '#d6a94c'; ctx.fill();
    // highlight
    ctx.beginPath(); ctx.moveTo(s0 + 10, -G.tw / 2 + 4); ctx.lineTo(s0 + G.len - 12, -G.tw / 2 + 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    // keyboard number
    const lp = { x: cx + Math.cos(a) * (s0 + G.len + 10), y: cy + Math.sin(a) * (s0 + G.len + 10) };
    if (lp.x > 6 && lp.x < W - 6 && lp.y > 6 && lp.y < H - 6) {
      ctx.fillStyle = 'rgba(214,169,76,0.6)'; ctx.font = '800 10px Manrope, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(t + 1), lp.x, lp.y);
    }
  });
  // hint: a pulsing halo around the tube to tap
  if (hint && hint.m[0] === 't') {
    const t = +hint.m.slice(1), a = portAngle(t), s0 = R + cupR + G.gap;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
    rr(s0 - 6, -G.tw / 2 - 6, G.len + 12, G.tw + 12, G.tw / 2 + 6);
    ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,214,120,${0.45 + 0.45 * Math.sin(time * 7)})`; ctx.stroke();
    ctx.restore();
  }
  // marbles in tubes (they hop in a wave when the puzzle is solved)
  st.tubes.forEach((tube, t) => tube.forEach((c, j) => {
    if (flyers.some(f => f.to.tube === t && f.to.j === j)) return;
    const p = tubeBallPos(t, j);
    let hop = 0;
    if (status === 'won') { const d = winT - t * 0.12 - j * 0.07; if (d > 0 && d < 0.45) hop = Math.sin(d / 0.45 * Math.PI) * mr * 0.9; }
    drawMarble(p.x, p.y - hop, mr, c);
  }));
  // a full single-colour tube glows
  st.tubes.forEach((tube, t) => {
    if (tube.length === cfg.cap && tube.every(v => v === tube[0])) {
      const p0 = tubeBallPos(t, 0), p1 = tubeBallPos(t, cfg.cap - 1);
      ctx.save(); ctx.strokeStyle = 'rgba(214,169,76,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineCap = 'round';
      ctx.globalAlpha = 0.35; ctx.lineWidth = mr * 2 + 8; ctx.stroke(); ctx.restore();
    }
  });

  // turntable
  ctx.save(); ctx.translate(shakeX, 0);
  ctx.beginPath(); ctx.arc(cx, cy, R + cupR + 6, 0, Math.PI * 2);
  const tg = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.2, cx, cy, R + cupR + 6);
  tg.addColorStop(0, '#2c2318'); tg.addColorStop(1, '#16110b');
  ctx.fillStyle = tg; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#d6a94c'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R - cupR - 6, 0, Math.PI * 2); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(214,169,76,0.6)'; ctx.stroke();
  // ticks that rotate with the table so turning is visible
  for (let i = 0; i < N; i++) {
    const a = slotAngle(i + 0.5);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * (R - cupR - 2), cy + Math.sin(a) * (R - cupR - 2));
    ctx.lineTo(cx + Math.cos(a) * (R + cupR + 2), cy + Math.sin(a) * (R + cupR + 2));
    ctx.strokeStyle = 'rgba(214,169,76,0.25)'; ctx.lineWidth = 1; ctx.stroke();
  }
  // tube mouths show what a tap would do: arrow in (marble goes into the tube), arrow out, or a red cross
  cfg.ports.forEach((p, t) => {
    const a = portAngle(t), r1 = R + cupR + 6, act = previewAction(t);
    const at = r => ({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
    const nx = -Math.sin(a), ny = Math.cos(a);
    ctx.save();
    if (act === 'in' || act === 'out') {
      const tip = at(act === 'in' ? r1 + 9 : r1 - 1), base = at(act === 'in' ? r1 - 1 : r1 + 9), w = 6;
      ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.lineTo(base.x + nx * w, base.y + ny * w); ctx.lineTo(base.x - nx * w, base.y - ny * w); ctx.closePath();
      ctx.fillStyle = act === 'in' ? '#ffd27a' : 'rgba(244,238,220,0.8)'; ctx.fill();
    } else if (act === 'blocked') {
      const c = at(r1 + 4), k = 4.5;
      ctx.strokeStyle = '#ff8a7a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(c.x - k, c.y - k); ctx.lineTo(c.x + k, c.y + k); ctx.moveTo(c.x + k, c.y - k); ctx.lineTo(c.x - k, c.y + k); ctx.stroke();
    } else {
      ctx.beginPath(); const c = at(r1 + 4); ctx.arc(c.x, c.y, 2, 0, Math.PI * 2); ctx.fillStyle = 'rgba(214,169,76,0.6)'; ctx.fill();
    }
    ctx.restore();
  });
  // cups and marbles on the table
  for (let i = 0; i < N; i++) {
    const p = slotPos(i);
    ctx.beginPath(); ctx.arc(p.x, p.y, cupR, 0, Math.PI * 2); ctx.fillStyle = '#0c0906'; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(214,169,76,0.3)'; ctx.stroke();
    const v = st.ring[i];
    if (v === -1) {
      const g = ctx.createRadialGradient(p.x - mr * 0.3, p.y - mr * 0.3, 1, p.x, p.y, mr);
      g.addColorStop(0, '#fff1c4'); g.addColorStop(0.4, '#d6a94c'); g.addColorStop(1, '#6d5016');
      ctx.beginPath(); ctx.arc(p.x, p.y, mr * 0.95, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, mr * 0.35, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(60,40,0,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (v > 0 && !flyers.some(f => f.to.slot === i)) drawMarble(p.x, p.y, mr, v);
  }
  // hub: moves left
  const hub = R - cupR - 10;
  if (hub > 24) {
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `400 ${Math.round(hub * 0.62)}px "Young Serif", Georgia, serif`;
    ctx.fillStyle = moves > cfg.par ? '#ff8a7a' : '#f4eedc';
    ctx.fillText(String(moves), cx, cy - hub * 0.12);
    ctx.font = `800 ${Math.max(9, Math.round(hub * 0.17))}px Manrope, system-ui, sans-serif`;
    ctx.fillStyle = '#d6a94c';
    ctx.fillText(`PAR ${cfg.par} · MAX ${budget()}`, cx, cy + hub * 0.42);
    if (cfg.oneWay) {
      ctx.fillStyle = 'rgba(214,169,76,0.75)';
      ctx.fillText('ONE WAY ↻', cx, cy - hub * 0.66);
    }
  }
  ctx.restore();

  // flying marbles
  flyers.forEach(f => {
    const to = f.to.tube != null ? tubeBallPos(f.to.tube, f.to.j) : slotPos(f.to.slot);
    const u = Math.min(1, f.t) - 1, e = 1 + 2.4 * u * u * u + 1.4 * u * u;   // ease-out with a small overshoot, so marbles settle
    drawMarble(f.from.x + (to.x - f.from.x) * e, f.from.y + (to.y - f.from.y) * e, mr * (1 + Math.sin(f.t * Math.PI) * 0.15), f.c);
  });
  sparks.forEach(s => { ctx.globalAlpha = Math.max(0, 1 - s.t / s.life); ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2); ctx.fill(); });
  ctx.globalAlpha = 1;
}

// ---------- Input on the board: tap tubes; drag around the table to turn it
let drag = null;
function pointAngle(x, y) { return Math.atan2(y - G.cy, x - G.cx); }
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const dx = x - G.cx, dy = y - G.cy, d = Math.hypot(dx, dy);
  // tube hit test: project the point onto each tube's axis
  for (let t = 0; t < cfg.ports.length; t++) {
    const a = portAngle(t), ux = Math.cos(a), uy = Math.sin(a);
    const along = dx * ux + dy * uy, across = Math.abs(-dx * uy + dy * ux);
    if (along > G.R + 4 && along < G.R + G.gap + G.len + 30 && across < G.tw / 2 + 12) { tapTube(t); return; }
  }
  if (d < G.R + G.mr + 30 && d > 12) { drag = { a: pointAngle(x, y), id: e.pointerId, moved: false, x, y, warned: false }; cv.setPointerCapture(e.pointerId); }
});
// the table follows the finger; each half-step past a cup commits one turn
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || status !== 'play') return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, a = pointAngle(x, y);
  if (Math.hypot(x - G.cx, y - G.cy) < 12) return;
  let da = a - drag.a; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
  if (Math.hypot(x - drag.x, y - drag.y) > 8) drag.moved = true;
  while (da > G.step * 0.5) { turn(1, true); drag.a += G.step; da -= G.step; }
  while (da < -G.step * 0.5) {
    if (cfg.oneWay) { if (!drag.warned) { turn(-1); drag.warned = true; } break; }
    turn(-1, true); drag.a -= G.step; da += G.step;
  }
  dragOff = cfg.oneWay ? Math.max(-0.12, Math.min(0.5, da / G.step)) : Math.max(-0.5, Math.min(0.5, da / G.step));
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const wasTap = !drag.moved, tx = drag.x, ty = drag.y;
  drag = null;
  if (wasTap && status === 'play') tapTable(tx, ty);
};
// tapping a cup at a tube mouth works like tapping the tube
function tapTable(x, y) {
  let bi = -1, bd = Infinity;
  for (let i = 0; i < st.ring.length; i++) { const p = slotPos(i), dd = Math.hypot(x - p.x, y - p.y); if (dd < bd) { bd = dd; bi = i; } }
  if (bd > G.mr + 10) return;
  const t = cfg.ports.indexOf(bi);
  if (t >= 0) tapTube(t);
  else if (st.ring[bi] > 0) flash('Turn the table to bring this marble to a <b>tube mouth</b>, then tap the tube.');
}
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// ---------- Loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  disp *= Math.pow(0.0008, dt); if (Math.abs(disp) < 0.002) disp = 0;
  if (status === 'won') {
    const before = winT; winT += dt;
    st.tubes.forEach((tube, t) => { const at = t * 0.12 + 0.2; if (before < at && winT >= at && tube.length) {
      const p = tubeBallPos(t, Math.floor(tube.length / 2));
      for (let k = 0; k < 14; k++) { const a = Math.random() * 6.28, v = 60 + Math.random() * 140; sparks.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.7 + Math.random() * 0.5, c: MARBLES[tube[0]].c }); }
      sfx.hop(t); } });
  }
  flyers.forEach(f => f.t += dt / 0.18); flyers = flyers.filter(f => f.t < 1);
  shakeT = Math.max(0, shakeT - dt); shakeRing = Math.max(0, shakeRing - dt); redT = Math.max(0, redT - dt);
  if (!drag) { dragOff *= Math.pow(0.0005, dt); if (Math.abs(dragOff) < 0.003) dragOff = 0; }
  sparks.forEach(s => { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.95; s.vy *= 0.95; }); sparks = sparks.filter(s => s.t < s.life);
  if (G) { draw(); updateTutorial(); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', layout);
if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
loadLevel(store.get('rl-level', 0));
window.__rl = { get G() { return G; }, get st() { return st; }, get hint() { return hint; }, askHint, get cfg() { return cfg; }, get moves() { return moves; }, get status() { return status; }, turn, tapTube, undo, loadLevel, LEVELS };
requestAnimationFrame(frame);

// ---------- home-screen app ----------
// Offline support only runs when the game is served as a web app (dist/ on a web
// host); inside a preview frame or a file:// page this quietly does nothing.
const standalone = (() => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } })();
let installPrompt = null;
function updateInstallRow() {
  const row = $('installRow'), btn = $('installBtn'), hint = $('installHint');
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isApp = !!document.querySelector('link[rel="manifest"]');
  if (standalone || !isApp) { row.hidden = true; return; }
  if (installPrompt) { row.hidden = false; btn.hidden = false; hint.textContent = 'Play from your home screen, even offline'; }
  else if (ios) { row.hidden = false; btn.hidden = true; hint.textContent = 'In Safari tap Share, then Add to Home Screen'; }
  else { row.hidden = true; }
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; updateInstallRow(); });
window.addEventListener('appinstalled', () => { installPrompt = null; $('installRow').hidden = true; });
$('installBtn').onclick = async () => {
  sfx.ui();
  if (!installPrompt) return;
  const p = installPrompt; installPrompt = null;
  try { await p.prompt(); await p.userChoice; } catch (e) {}
  updateInstallRow();
};
updateInstallRow();
try {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
} catch (e) {}
})();
</script>
